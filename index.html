<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <title>Rizvy & Raisa Live Distance</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS (Reliable Cloudflare CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <!-- Leaflet JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { 
      background: radial-gradient(circle at top, #1e1b4b, #090d16 70%); 
      color: #f8fafc; 
      font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; 
      min-height: 100vh;
      margin: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Map Container Guaranteed Height */
    #map-wrapper {
      width: 100%;
      max-width: 440px;
      height: 330px;
      position: relative;
      border-radius: 1.25rem;
      padding: 6px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(236, 72, 153, 0.35);
      box-shadow: 0 12px 30px -5px rgba(0, 0, 0, 0.6);
    }

    #map { 
      width: 100%; 
      height: 100%; 
      min-height: 316px;
      border-radius: 1rem; 
      z-index: 10; 
      background: #1e293b;
    }

    .pulse-card {
      animation: soft-glow 3s infinite;
    }
    @keyframes soft-glow {
      0%, 100% { box-shadow: 0 0 15px rgba(236, 72, 153, 0.15); }
      50% { box-shadow: 0 0 28px rgba(236, 72, 153, 0.35); }
    }

    /* Custom Floating Pin Style */
    .custom-pin {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .pin-label {
      background: #ec4899;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      white-space: nowrap;
      box-shadow: 0 3px 8px rgba(0,0,0,0.4);
      border: 1.5px solid #fff;
      margin-bottom: 2px;
    }
    .pin-label.partner {
      background: #8b5cf6;
    }
    .pin-dot {
      width: 14px;
      height: 14px;
      background: #ec4899;
      border: 2.5px solid white;
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(236, 72, 153, 0.9);
    }
    .pin-dot.partner {
      background: #8b5cf6;
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.9);
    }
  </style>
</head>
<body>

  <!-- Romantic Header -->
  <div class="text-center my-2">
    <h1 class="text-2xl font-extrabold bg-gradient-to-r from-pink-400 via-rose-400 to-purple-400 bg-clip-text text-transparent tracking-wide">
      ✨ Rizvy ❤️ Raisa ✨
    </h1>
    <p class="text-[11px] text-slate-400 tracking-widest uppercase mt-0.5">Live GPS Distance Tracker</p>
  </div>

  <!-- Role Switcher (With Confirmation) -->
  <div class="bg-slate-900/90 p-1.5 rounded-2xl flex gap-2 mb-3 border border-slate-800 shadow-lg w-full max-w-[440px]">
    <button id="btn-rizvy" onclick="switchRole('rizvy')" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition">
      👦 I am Rizvy
    </button>
    <button id="btn-raisa" onclick="switchRole('raisa')" class="flex-1 py-2.5 rounded-xl text-xs font-bold transition">
      👧 I am Raisa
    </button>
  </div>

  <!-- Distance Display Card -->
  <div class="w-full max-w-[440px] bg-slate-900/85 backdrop-blur-md border border-pink-500/30 rounded-2xl p-4 text-center mb-3 pulse-card">
    <p class="text-[10px] uppercase tracking-widest text-slate-400 font-semibold">Our Current Distance</p>
    <div id="distance-text" class="text-3xl font-black text-pink-400 my-1 tracking-tight">
      Connecting...
    </div>
    <p id="sub-distance" class="text-xs text-slate-300 font-medium min-h-[16px]"></p>
    
    <div class="mt-3 flex flex-wrap justify-center gap-2">
      <span id="closeness-badge" class="px-3.5 py-1 rounded-full text-[11px] font-semibold bg-pink-500/15 text-pink-300 border border-pink-500/30">
        📡 Syncing GPS...
      </span>
      <button onclick="triggerRefresh()" class="px-3.5 py-1 rounded-full text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 active:scale-95 text-pink-400 border border-slate-700 transition">
        🔄 Refresh GPS
      </button>
      <button onclick="centerMapBounds()" class="px-3.5 py-1 rounded-full text-[11px] font-semibold bg-slate-800 hover:bg-slate-700 active:scale-95 text-purple-400 border border-slate-700 transition">
        🎯 Center Map
      </button>
    </div>
  </div>

  <!-- Live Map Wrapper -->
  <div id="map-wrapper">
    <div id="map"></div>
  </div>

  <!-- Live Status Bar -->
  <div class="w-full max-w-[440px] mt-3 bg-slate-900/70 border border-slate-800/80 rounded-xl py-2 px-3 flex justify-between items-center text-[11px] text-slate-300">
    <span id="my-status" class=" truncate">🟢 My GPS: Starting...</span>
    <span id="partner-status" class="truncate">⚪ Partner: Waiting...</span>
  </div>

  <footer class="mt-4 text-[10px] text-slate-500 tracking-wider">
    Made with ❤️ for Rizvy & Raisa
  </footer>

  <!-- Firebase & Application Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Your Exact Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyCfm6IFlohkc8Zvv4diO2j03ypb_xWIF1Y",
      authDomain: "rizvy-and-raisa.firebaseapp.com",
      databaseURL: "https://rizvy-and-raisa-default-rtdb.firebaseio.com",
      projectId: "rizvy-and-raisa",
      storageBucket: "rizvy-and-raisa.firebasestorage.app",
      messagingSenderId: "633457243403",
      appId: "1:633457243403:web:89262b98434b73ed47de0e",
      measurementId: "G-ML0LN4L2L4"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // 1. Role Management
    let currentRole = 'rizvy';
    try {
      currentRole = localStorage.getItem('tracker_role') || 'rizvy';
    } catch(e) {}

    let map = null;
    let markerRizvy = null;
    let markerRaisa = null;
    let polyline = null;
    let watchId = null;
    let locations = { rizvy: null, raisa: null };
    let firstFitDone = false;

    updateRoleUI(currentRole);

    window.switchRole = function(role) {
      if (role === currentRole) return;
      const targetName = role === 'rizvy' ? 'Rizvy' : 'Raisa';
      if (confirm(`Are you sure you want to switch to "${targetName}"?`)) {
        currentRole = role;
        try {
          localStorage.setItem('tracker_role', role);
        } catch(e) {}
        updateRoleUI(role);
        firstFitDone = false;
        startGPSTracking();
        updateDisplay();
      }
    };

    function updateRoleUI(role) {
      const btnRizvy = document.getElementById('btn-rizvy');
      const btnRaisa = document.getElementById('btn-raisa');
      if (role === 'rizvy') {
        btnRizvy.className = "flex-1 py-2.5 rounded-xl text-xs font-bold bg-gradient-to-r from-pink-600 to-rose-500 text-white shadow-md transition";
        btnRaisa.className = "flex-1 py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition";
      } else {
        btnRaisa.className = "flex-1 py-2.5 rounded-xl text-xs font-bold bg-gradient-to-r from-pink-600 to-rose-500 text-white shadow-md transition";
        btnRizvy.className = "flex-1 py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition";
      }
    }

    // 2. Guaranteed Map Initialization
    function initMap() {
      if (map) return;

      map = L.map('map', { 
        zoomControl: true,
        attributionControl: false 
      }).setView([23.6850, 90.5000], 12);

      // Primary Tile Server: CartoDB Voyager (No 403 block, fast & clean)
      const primaryTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        subdomains: 'abcd'
      });

      // Backup Tile Server: Esri World Street Map (If primary ever fails)
      const backupTiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 19
      });

      primaryTiles.on('tileerror', function() {
        if (!map.hasLayer(backupTiles)) {
          backupTiles.addTo(map);
        }
      });

      primaryTiles.addTo(map);

      // Force map to recalculate size multiple times so it never stays gray/blank
      const mapEl = document.getElementById('map');
      if (window.ResizeObserver && mapEl) {
        new ResizeObserver(() => {
          if (map) map.invalidateSize();
        }).observe(mapEl);
      }

      setTimeout(() => { if (map) map.invalidateSize(); }, 200);
      setTimeout(() => { if (map) map.invalidateSize(); }, 800);
      setTimeout(() => { if (map) map.invalidateSize(); }, 2000);
    }

    // Custom HTML Pin Generator
    function createPinIcon(name, isPartner) {
      return L.divIcon({
        className: 'custom-pin',
        html: `
          <div class="pin-label ${isPartner ? 'partner' : ''}">${name}</div>
          <div class="pin-dot ${isPartner ? 'partner' : ''}"></div>
        `,
        iconSize: [80, 36],
        iconAnchor: [40, 30]
      });
    }

    // Haversine Distance Formula (in meters)
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const p1 = lat1 * Math.PI / 180;
      const p2 = lat2 * Math.PI / 180;
      const dp = (lat2 - lat1) * Math.PI / 180;
      const dl = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dp/2) * Math.sin(dp/2) + Math.cos(p1) * Math.cos(p2) * Math.sin(dl/2) * Math.sin(dl/2);
      return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    // 3. Render Markers & Distance
    function updateDisplay() {
      if (!map) initMap();
      if (!map) return;

      const r1 = locations.rizvy;
      const r2 = locations.raisa;
      const partnerRole = currentRole === 'rizvy' ? 'raisa' : 'rizvy';
      const partnerData = locations[partnerRole];

      // Update Rizvy Marker
      if (r1 && typeof r1.lat === 'number' && typeof r1.lng === 'number') {
        const iconRizvy = createPinIcon('👦 Rizvy', currentRole !== 'rizvy');
        if (!markerRizvy) {
          markerRizvy = L.marker([r1.lat, r1.lng], { icon: iconRizvy }).addTo(map);
        } else {
          markerRizvy.setLatLng([r1.lat, r1.lng]);
          markerRizvy.setIcon(iconRizvy);
        }
      }

      // Update Raisa Marker
      if (r2 && typeof r2.lat === 'number' && typeof r2.lng === 'number') {
        const iconRaisa = createPinIcon('👧 Raisa', currentRole !== 'raisa');
        if (!markerRaisa) {
          markerRaisa = L.marker([r2.lat, r2.lng], { icon: iconRaisa }).addTo(map);
        } else {
          markerRaisa.setLatLng([r2.lat, r2.lng]);
          markerRaisa.setIcon(iconRaisa);
        }
      }

      // Update Partner Status Text
      const partnerName = partnerRole === 'rizvy' ? 'Rizvy' : 'Raisa';
      if (partnerData && partnerData.updatedAt) {
        const secAgo = Math.max(0, Math.round((Date.now() - partnerData.updatedAt) / 1000));
        if (secAgo < 90) {
          document.getElementById('partner-status').innerText = `🟢 ${partnerName}: Online`;
        } else if (secAgo < 3600) {
          document.getElementById('partner-status').innerText = `🕒 ${partnerName}: ${Math.round(secAgo/60)}m ago`;
        } else {
          document.getElementById('partner-status').innerText = `⚪ ${partnerName}: Offline`;
        }
      } else {
        document.getElementById('partner-status').innerText = `⚪ ${partnerName}: Waiting...`;
      }

      // Calculate Distance & Draw Line if both exist
      if (r1 && r2 && typeof r1.lat === 'number' && typeof r2.lat === 'number') {
        if (polyline) map.removeLayer(polyline);
        polyline = L.polyline([[r1.lat, r1.lng], [r2.lat, r2.lng]], {
          color: '#ec4899', weight: 3.5, dashArray: '8, 8'
        }).addTo(map);

        if (!firstFitDone) {
          centerMapBounds();
          firstFitDone = true;
        }

        const meters = Math.round(calculateDistance(r1.lat, r1.lng, r2.lat, r2.lng));
        const km = (meters / 1000).toFixed(2);

        const distText = document.getElementById('distance-text');
        const subDist = document.getElementById('sub-distance');
        const badge = document.getElementById('closeness-badge');

        if (meters < 1000) {
          distText.innerText = `${meters} Meters`;
          subDist.innerText = `(${km} km apart)`;
        } else {
          distText.innerText = `${km} KM`;
          subDist.innerText = `(${meters.toLocaleString()} meters apart)`;
        }

        if (meters <= 30) {
          badge.innerText = "🥰 Right next to each other!";
        } else if (meters <= 300) {
          badge.innerText = "💓 Very close! Just steps away";
        } else if (meters <= 2000) {
          badge.innerText = "✨ In the same area!";
        } else {
          badge.innerText = "🌍 Connected by heart ❤️";
        }
      } else {
        const myData = locations[currentRole];
        if (myData && typeof myData.lat === 'number' && !firstFitDone) {
          map.setView([myData.lat, myData.lng], 15);
          firstFitDone = true;
        }
        document.getElementById('distance-text').innerText = "Waiting...";
        document.getElementById('sub-distance').innerText = `Waiting for ${partnerName} to connect GPS`;
      }
    }

    window.centerMapBounds = function() {
      if (!map) return;
      const r1 = locations.rizvy;
      const r2 = locations.raisa;
      if (r1 && r2 && markerRizvy && markerRaisa) {
        const group = new L.featureGroup([markerRizvy, markerRaisa]);
        map.fitBounds(group.getBounds().pad(0.35), { maxZoom: 17 });
      } else if (locations[currentRole]) {
        map.setView([locations[currentRole].lat, locations[currentRole].lng], 15);
      }
    };

    // 4. Live GPS Tracking & Firebase Push
    function saveLocationToFirebase(pos) {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      document.getElementById('my-status').innerText = `🟢 My GPS: Live`;

      set(ref(db, 'couples_location_live/' + currentRole), {
        lat: lat,
        lng: lng,
        updatedAt: Date.now()
      }).catch((err) => {
        document.getElementById('my-status').innerText = `🔴 DB Rules Error`;
      });
    }

    function handleGPSError(err) {
      if (err.code === 1) {
        document.getElementById('my-status').innerText = `🔴 Allow Location Permission!`;
      } else {
        document.getElementById('my-status').innerText = `🟡 Weak GPS Signal...`;
      }
    }

    function startGPSTracking() {
      document.getElementById('my-status').innerText = `🔄 Locking GPS...`;
      if (!navigator.geolocation) {
        document.getElementById('my-status').innerText = `🔴 GPS Not Supported`;
        return;
      }

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
      }

      // Immediate position fetch
      navigator.geolocation.getCurrentPosition(saveLocationToFirebase, handleGPSError, {
        enableHighAccuracy: true, timeout: 15000, maximumAge: 0
      });

      // Continuous live movement tracking
      watchId = navigator.geolocation.watchPosition(saveLocationToFirebase, handleGPSError, {
        enableHighAccuracy: true, timeout: 20000, maximumAge: 5000
      });
    }

    window.triggerRefresh = function() {
      firstFitDone = false;
      if (map) map.invalidateSize();
      startGPSTracking();
    };

    // 5. Real-time Firebase Listener
    onValue(ref(db, 'couples_location_live'), (snapshot) => {
      const data = snapshot.val();
      if (data) {
        locations.rizvy = data.rizvy || null;
        locations.raisa = data.raisa || null;
        updateDisplay();
      }
    });

    // Start Everything
    initMap();
    startGPSTracking();
  </script>
</body>
</html>
