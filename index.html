<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rizvy ❤️ Raisa - Live Distance Tracker</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Google Fonts (Poppins) -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body { 
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311037 100%);
      color: #f8fafc; 
      font-family: 'Poppins', sans-serif; 
    }
    #map { height: 280px; width: 100%; border-radius: 1.25rem; z-index: 10; border: 1.5px solid rgba(244, 63, 94, 0.3); }
    .glass-card {
      background: rgba(30, 41, 59, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(244, 63, 94, 0.2);
    }
    .heart-beat {
      animation: heartbeat 1.5s infinite ease-in-out;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 max-w-md mx-auto relative selection:bg-rose-500 selection:text-white">

  <div class="w-full flex flex-col items-center">
    <!-- Header -->
    <div class="text-center my-3">
      <div class="inline-flex items-center justify-center gap-2 mb-1">
        <span class="text-rose-500 text-2xl heart-beat">✨</span>
        <h1 class="text-2xl font-extrabold bg-gradient-to-r from-rose-400 via-pink-400 to-purple-400 bg-clip-text text-transparent">
          Rizvy & Raisa
        </h1>
        <span class="text-rose-500 text-2xl heart-beat">✨</span>
      </div>
      <p class="text-[11px] text-rose-300/80 tracking-widest uppercase font-medium">Live Distance Companion</p>
    </div>

    <!-- Role Switcher -->
    <div class="glass-card p-1.5 rounded-2xl flex gap-2 mb-4 w-full shadow-lg">
      <button type="button" id="btn-rizvy" onclick="window.confirmSwitchRole('rizvy')" class="flex-1 py-2.5 rounded-xl text-xs font-semibold transition duration-300 cursor-pointer">
        👦 I am Rizvy
      </button>
      <button type="button" id="btn-raisa" onclick="window.confirmSwitchRole('raisa')" class="flex-1 py-2.5 rounded-xl text-xs font-semibold transition duration-300 cursor-pointer">
        👧 I am Raisa
      </button>
    </div>

    <!-- Distance Display Card -->
    <div class="glass-card w-full rounded-[2rem] p-6 text-center shadow-2xl mb-4 relative overflow-hidden">
      <div class="absolute -top-12 -right-12 w-36 h-36 bg-rose-500/10 rounded-full blur-3xl pointer-events-none"></div>
      
      <p class="text-[11px] uppercase tracking-widest text-slate-400 font-semibold mb-1">Our Current Distance</p>
      
      <div id="distance-text" class="text-3xl font-black text-rose-400 my-1 tracking-tight">
        Loading...
      </div>
      <p id="sub-distance" class="text-xs text-slate-300 font-medium h-5 mb-3"></p>
      
      <div class="flex items-center justify-center gap-2">
        <span id="closeness-badge" class="px-3.5 py-1.5 rounded-full text-[11px] font-semibold bg-rose-500/15 text-rose-300 border border-rose-500/30 shadow-inner">
          🛰️ Connecting GPS...
        </span>
        <button type="button" onclick="window.forceRefreshGPS()" class="bg-rose-600/80 hover:bg-rose-600 text-white px-3 py-1.5 rounded-full text-[11px] font-semibold transition shadow cursor-pointer">
          🔄 Refresh
        </button>
      </div>
    </div>

    <!-- Live Map Container -->
    <div class="glass-card w-full p-2 rounded-[2rem] shadow-xl mb-3">
      <div id="map"></div>
    </div>

    <!-- Status Bar -->
    <div class="glass-card w-full flex justify-between items-center text-[11px] text-slate-300 px-4 py-3 rounded-2xl">
      <span id="my-status" class="flex items-center gap-1.5 font-medium">🟡 My GPS: Waiting...</span>
      <span id="partner-status" class="flex items-center gap-1.5 font-medium">⚪ Partner: Waiting...</span>
    </div>
  </div>

  <footer class="mt-4 text-center text-[10px] text-slate-400 font-medium">
    Made with ❤️ for Rizvy & Raisa
  </footer>

  <script>
    // State management & safe storage parsing
    let currentRole = localStorage.getItem('rizvy_raisa_role') || 'rizvy';
    let map, markerRizvy, markerRaisa, lineBetween;
    let locations = { rizvy: null, raisa: null };

    window.confirmSwitchRole = function(role) {
      if (currentRole === role) return;
      
      const roleName = role === 'rizvy' ? 'Rizvy' : 'Raisa';
      const isConfirmed = window.confirm(`Are you sure you want to switch to ${roleName}?`);
      
      if (isConfirmed) {
        currentRole = role;
        localStorage.setItem('rizvy_raisa_role', role);
        updateRoleUI();
        window.forceRefreshGPS();
      }
    };

    function updateRoleUI() {
      const btnRizvy = document.getElementById('btn-rizvy');
      const btnRaisa = document.getElementById('btn-raisa');
      if (!btnRizvy || !btnRaisa) return;

      if (currentRole === 'rizvy') {
        btnRizvy.className = "flex-1 py-2.5 rounded-xl text-xs font-bold bg-gradient-to-r from-rose-600 to-pink-600 text-white shadow-lg shadow-rose-600/30 transition duration-300 cursor-pointer";
        btnRaisa.className = "flex-1 py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition duration-300 cursor-pointer";
      } else {
        btnRaisa.className = "flex-1 py-2.5 rounded-xl text-xs font-bold bg-gradient-to-r from-rose-600 to-pink-600 text-white shadow-lg shadow-rose-600/30 transition duration-300 cursor-pointer";
        btnRizvy.className = "flex-1 py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition duration-300 cursor-pointer";
      }
    }

    function initMap() {
      try {
        map = L.map('map', { zoomControl: false }).setView([23.8103, 90.4125], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
          attribution: '© OpenStreetMap'
        }).addTo(map);
      } catch (err) {
        console.error("Map init error:", err);
      }
      
      setTimeout(() => { 
        if (map) map.invalidateSize(); 
      }, 300);

      loadSavedLocations();
      checkAndStartGPS();
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function updateMapAndDistance() {
      if (!map) return;
      const r1 = locations.rizvy;
      const r2 = locations.raisa;

      if (r1 && typeof r1.lat === 'number' && typeof r1.lng === 'number') {
        const latLng = [r1.lat, r1.lng];
        if (!markerRizvy) {
          markerRizvy = L.marker(latLng).addTo(map).bindPopup("Rizvy");
        } else {
          markerRizvy.setLatLng(latLng);
        }
      }

      if (r2 && typeof r2.lat === 'number' && typeof r2.lng === 'number') {
        const latLng = [r2.lat, r2.lng];
        if (!markerRaisa) {
          markerRaisa = L.marker(latLng).addTo(map).bindPopup("Raisa");
        } else {
          markerRaisa.setLatLng(latLng);
        }
      }

      if (r1 && r2 && r1.lat && r1.lng && r2.lat && r2.lng) {
        if (lineBetween) map.removeLayer(lineBetween);
        lineBetween = L.polyline([[r1.lat, r1.lng], [r2.lat, r2.lng]], {
          color: '#f43f5e', weight: 4, dashArray: '8, 8'
        }).addTo(map);

        if (markerRizvy && markerRaisa) {
          const group = new L.featureGroup([markerRizvy, markerRaisa]);
          map.fitBounds(group.getBounds().pad(0.3));
        }

        const meters = Math.round(calculateDistance(r1.lat, r1.lng, r2.lat, r2.lng));
        const km = (meters / 1000).toFixed(2);

        const distEl = document.getElementById('distance-text');
        const subDistEl = document.getElementById('sub-distance');
        const badgeEl = document.getElementById('closeness-badge');

        if (meters < 1000) {
          distEl.innerText = `${meters} meters`;
          subDistEl.innerText = `(${km} km away)`;
        } else {
          distEl.innerText = `${km} kilometers`;
          subDistEl.innerText = `(approx ${meters.toLocaleString()} meters)`;
        }

        if (meters <= 25) {
          badgeEl.innerText = "🥰 You are right next to each other!";
        } else if (meters <= 200) {
          badgeEl.innerText = "💓 Very close!";
        } else {
          badgeEl.innerText = "✨ Live tracking active";
        }
      } else if (r1 && r1.lat && r1.lng) {
        map.setView([r1.lat, r1.lng], 15);
      }
    }

    let bc = null;
    try {
      bc = new BroadcastChannel('rizvy_raisa_sync_channel_v9');
      bc.onmessage = (event) => {
        if (event.data && event.data.role && event.data.lat) {
          locations[event.data.role] = { lat: event.data.lat, lng: event.data.lng, timestamp: Date.now() };
          localStorage.setItem('rr_loc_' + event.data.role, JSON.stringify(locations[event.data.role]));
          updateMapAndDistance();
        }
      };
    } catch(e) {}

    window.addEventListener('storage', (e) => {
      if (e.key && e.key.startsWith('rr_loc_')) {
        const roleKey = e.key.replace('rr_loc_', '');
        try {
          const parsed = JSON.parse(e.newValue);
          if (parsed) {
            locations[roleKey] = parsed;
            updateMapAndDistance();
          }
        } catch(err) {}
      }
    });

    function loadSavedLocations() {
      ['rizvy', 'raisa'].forEach(role => {
        const saved = localStorage.getItem('rr_loc_' + role);
        if (saved) {
          try { 
            locations[role] = JSON.parse(saved); 
          } catch(e) {}
        }
      });
      updateMapAndDistance();
    }

    function checkAndStartGPS() {
      if (!navigator.geolocation) {
        document.getElementById('my-status').innerText = `🔴 GPS not supported`;
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          processPosition(position);
          startContinuousWatch();
        },
        (error) => {
          document.getElementById('my-status').innerHTML = `🔴 Allow Location Permission`;
        },
        { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
      );
    }

    function startContinuousWatch() {
      navigator.geolocation.watchPosition(
        (position) => {
          processPosition(position);
        },
        (error) => {
          document.getElementById('my-status').innerHTML = `🟡 Searching GPS signal...`;
        },
        { enableHighAccuracy: true, maximumAge: 3000, timeout: 20000 }
      );
    }

    function processPosition(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      document.getElementById('my-status').innerHTML = `🟢 GPS Live (${Math.round(accuracy)}m accuracy)`;

      locations[currentRole] = { lat, lng, timestamp: Date.now() };
      localStorage.setItem('rr_loc_' + currentRole, JSON.stringify(locations[currentRole]));
      
      if (bc) {
        try { bc.postMessage({ role: currentRole, lat, lng }); } catch(e) {}
      }
      updateMapAndDistance();
    }

    window.forceRefreshGPS = function() {
      document.getElementById('my-status').innerHTML = `🔄 Refreshing GPS...`;
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            processPosition(pos);
            startContinuousWatch();
          },
          (err) => {
            document.getElementById('my-status').innerHTML = `🔴 Allow Location Permission`;
          },
          { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
        );
      }
    };

    setInterval(() => {
      loadSavedLocations();
      const partnerKey = currentRole === 'rizvy' ? 'raisa' : 'rizvy';
      const partnerName = partnerKey === 'rizvy' ? 'Rizvy' : 'Raisa';
      
      const partnerData = locations[partnerKey];
      if (partnerData && partnerData.timestamp) {
        const diffSec = Math.round((Date.now() - partnerData.timestamp) / 1000);
        if (diffSec < 180) {
          document.getElementById('partner-status').innerHTML = `🟢 ${partnerName}: Online`;
        } else {
          document.getElementById('partner-status').innerHTML = `🕒 ${partnerName}: Offline`;
        }
      } else {
        document.getElementById('partner-status').innerHTML = `⚪ ${partnerName}: Waiting...`;
      }
    }, 4000);

    window.onload = function() {
      updateRoleUI();
      initMap();
    };
  </script>
</body>
</html>
